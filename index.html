<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaHype - D.Pharm Study Portal</title>
  <style>
    :root {
      --medical-teal: #0e7490;
      --medical-light: #0891b2;
      --medical-bg: #f8fafc;
      --medical-card: #ffffff;
      --medical-text: #1e293b;
      --medical-muted: #64748b;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-600: #475569;
      --slate-700: #334155;
      --amber-100: #fef3c7;
      --amber-500: #f59e0b;
      --amber-700: #b45309;
      --cyan-100: #cffafe;
      --cyan-500: #06b6d4;
      --cyan-600: #0891b2;
      --white: #ffffff;
      --dark-bg: #0f172a;
      --dark-card: #1e293b;
      --dark-text: #f1f5f9;
      --dark-muted: #94a3b8;
      --theme-intensity: 0.5;
      --primary-color: #0d9488;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: rgba(243, 244, 246, var(--theme-intensity));
      color: var(--medical-text);
      transition: background 0.3s ease, color 0.3s ease;
    }

    body.dark {
      background: var(--dark-bg);
      color: var(--dark-text);
    }
    body.settings-preview { font-family: var(--settings-font, Arial, sans-serif); }
    body.settings-preview:not(.dark) { background: rgba(243, 244, 246, var(--theme-intensity)); }
    body.settings-preview .header,
    body.settings-preview .section-divider,
    body.settings-preview .progress-fill,
    body.settings-preview .timer-btn.primary { background-color: var(--primary-color); }
    body.settings-preview .course-card:hover,
    body.settings-preview .subject-card:hover,
    body.settings-preview .chapter-card:hover { border-color: var(--primary-color); }
    body.settings-preview .course-card .cta,
    body.settings-preview .meta-item,
    body.settings-preview .timer-display,
    body.settings-preview .back-link { color: var(--primary-color); }

    a, button, input { font: inherit; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .header {
      background: var(--medical-teal);
      color: white;
      box-shadow: 0 10px 18px rgba(8, 145, 178, 0.12);
      margin-bottom: 30px;
    }
    body.dark .header { background: var(--dark-card); }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0;
    }
    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 3vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .header p {
      margin: 0;
      color: var(--cyan-100);
      font-size: 1.02rem;
      font-weight: 600;
    }
    .theme-btn {
      width: 48px; height: 48px; border: none; border-radius: 50%;
      background: var(--cyan-600); color: white; font-size: 1.2rem; cursor: pointer;
      transition: 0.2s ease;
    }
    .theme-btn:hover { background: #0a6d8b; }
    .settings-btn {
      width: 48px; height: 48px; border: 1px solid rgba(255,255,255,0.35); border-radius: 50%;
      background: transparent; color: white; font-size: 1.25rem; cursor: pointer;
    }
    .header-actions { display: flex; gap: 10px; }
    .account-btn {
      border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; padding: 0 16px;
      background: transparent; color: white; cursor: pointer; font-weight: 700;
    }

    .page-shell { padding-bottom: 50px; }

    .breadcrumbs {
      color: var(--medical-muted);
      font-size: 0.9rem;
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 auto 24px; max-width: 1200px; padding: 0 24px;
    }
    body.dark .breadcrumbs { color: var(--dark-muted); }
    .breadcrumbs button {
      border: none; background: transparent; color: inherit; cursor: pointer; font-weight: 600;
      padding: 0;
    }
    .breadcrumbs .crumb-sep { color: var(--slate-300); }
    body.dark .breadcrumbs .crumb-sep { color: var(--slate-600); }

    .section-title {
      text-align: center; margin-bottom: 38px;
    }
    .section-title h2 {
      margin: 0 0 14px; font-size: clamp(2rem, 2.4vw, 2.7rem);
    }
    .section-divider {
      width: 92px; height: 5px; background: var(--medical-teal); border-radius: 999px; margin: 0 auto;
    }
    body.dark .section-divider { background: var(--cyan-500); }
    .dashboard { max-width: 1200px; margin: 0 auto; padding: 0 24px 50px; display: grid; gap: 28px; }
    .dashboard-hero {
      background: linear-gradient(135deg, #0d9488 0%, #0284c7 100%);
      color: white; border-radius: 28px; padding: 30px; display: flex; align-items: center;
      justify-content: space-between; gap: 24px; box-shadow: 0 16px 30px rgba(2, 132, 199, 0.18);
    }
    .dashboard-hero h2 { margin: 0; font-size: clamp(1.8rem, 3vw, 2.4rem); }
    .dashboard-hero p { margin: 8px 0 0; color: #ccfbf1; }
    .streak-badge {
      width: 112px; height: 112px; border-radius: 50%; background: rgba(255,255,255,0.2);
      display: grid; place-items: center; align-content: center; flex-shrink: 0;
    }
    .streak-badge strong { font-size: 2.5rem; line-height: 1; }
    .streak-badge span { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 6px; }
    .dashboard-grid { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(0, 2fr); gap: 28px; }
    .dashboard-controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
    .dashboard-card { padding: 32px; }
    .dashboard-card h3 { margin: 0 0 26px; font-size: 1.3rem; }
    .timer-display { color: var(--medical-teal); font: 700 3.2rem/1 monospace; text-align: center; margin: 0 0 26px; }
    body.dark .timer-display { color: var(--cyan-400); }
    .timer-settings { display: flex; gap: 10px; width: 100%; margin-bottom: 20px; }
    .timer-settings input { min-width: 0; flex: 1; padding: 11px; border: 1px solid var(--slate-300); border-radius: 10px; background: transparent; color: inherit; text-align: center; }
    .timer-settings .timer-btn { padding: 10px 16px; }
    .timer-actions { display: flex; justify-content: center; gap: 12px; }
    .timer-btn { border: none; border-radius: 999px; padding: 12px 28px; font-weight: 700; cursor: pointer; }
    .timer-btn.primary { background: var(--medical-teal); color: white; }
    .timer-btn.secondary { background: var(--slate-200); color: var(--medical-text); }
    body.dark .timer-btn.secondary { background: var(--slate-700); color: var(--dark-text); }
    .progress-row { display: flex; justify-content: space-between; gap: 12px; color: var(--medical-muted); font-size: 0.9rem; font-weight: 600; }
    body.dark .progress-row { color: var(--dark-muted); }
    .progress-track { height: 16px; background: var(--slate-200); border-radius: 999px; overflow: hidden; margin-top: 14px; }
    body.dark .progress-track { background: var(--slate-700); }
    .progress-fill { height: 100%; width: 75%; background: var(--medical-teal); border-radius: inherit; transition: width 0.3s ease; }
    .settings-panel { max-width: 760px; margin: 0 auto; padding: 0 24px 50px; }
    .settings-card { padding: 32px; }
    .settings-card h2 { margin: 0 0 28px; color: var(--primary-color); font-size: 2rem; }
    .settings-form { display: grid; gap: 24px; }
    .settings-field { display: grid; gap: 9px; }
    .settings-field label { font-size: 0.95rem; font-weight: 700; color: var(--medical-text); }
    body.dark .settings-field label { color: var(--dark-text); }
    .settings-field input[type="range"], .settings-field select {
      width: 100%; padding: 11px; border: 1px solid var(--slate-300); border-radius: 10px;
      background: var(--medical-card); color: inherit;
    }
    body.dark .settings-field select { background: var(--dark-card); border-color: var(--slate-700); }
    .save-settings { width: 100%; border: none; border-radius: 10px; padding: 13px; color: white; background: var(--primary-color); font-weight: 700; cursor: pointer; }
    .settings-status { min-height: 20px; text-align: center; color: var(--medical-teal); font-weight: 700; }
    .auth-page {
      min-height: calc(100vh - 120px); display: grid; place-items: center; padding: 0 24px 50px;
    }
    .auth-card { width: min(100%, 460px); padding: 34px; }
    .auth-card h2 { margin: 0 0 8px; font-size: 2rem; color: var(--medical-text); }
    body.dark .auth-card h2 { color: var(--dark-text); }
    .auth-card > p { margin: 0 0 26px; color: var(--medical-muted); }
    body.dark .auth-card > p { color: var(--dark-muted); }
    .auth-form { display: grid; gap: 18px; }
    .auth-field { display: grid; gap: 8px; }
    .auth-field label { font-weight: 700; font-size: 0.9rem; }
    .auth-field input { width: 100%; padding: 13px 14px; border: 1px solid var(--slate-200); border-radius: 12px; background: transparent; color: inherit; }
    body.dark .auth-field input { border-color: var(--slate-700); }
    .auth-submit { border: none; border-radius: 12px; padding: 14px; background: var(--primary-color); color: white; font-weight: 700; cursor: pointer; }
    .auth-switch { text-align: center; margin: 24px 0 0; color: var(--medical-muted); }
    body.dark .auth-switch { color: var(--dark-muted); }
    .auth-switch button { border: none; background: transparent; color: var(--primary-color); font-weight: 700; cursor: pointer; }
    .auth-message { min-height: 20px; margin: 0; color: var(--medical-teal); text-align: center; font-weight: 700; }
    .profile-avatar-wrap { position: relative; width: 92px; height: 92px; margin: 0 auto 16px; }
    .profile-avatar, .profile-initials {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: grid; place-items: center;
      background: #ccfbf1; color: var(--primary-color); font-size: 2rem; font-weight: 800;
    }
    .profile-edit {
      position: absolute; right: -2px; bottom: -2px; width: 30px; height: 30px; border: 2px solid white;
      border-radius: 50%; background: var(--primary-color); color: white; cursor: pointer; font-size: 0.9rem;
    }
    .profile-upload { display: none; }
    .notes-card { grid-column: 1 / -1; }
    .notes-upload {
      border: 2px dashed var(--slate-200); border-radius: 18px; padding: 24px; text-align: center;
      cursor: pointer; transition: border-color 0.2s ease; color: var(--medical-muted);
    }
    .notes-upload:hover { border-color: var(--primary-color); }
    .notes-upload strong { display: block; color: var(--medical-text); margin-top: 8px; }
    body.dark .notes-upload { border-color: var(--slate-700); color: var(--dark-muted); }
    body.dark .notes-upload strong { color: var(--dark-text); }
    .notes-list { display: grid; gap: 10px; margin: 18px 0 0; padding: 0; list-style: none; }
    .note-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; background: rgba(241,245,249,0.75); border: 1px solid var(--slate-200); border-radius: 14px; }
    body.dark .note-item { background: rgba(51,65,85,0.45); border-color: var(--slate-700); }
    .note-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
    .note-remove { border: none; background: transparent; color: #dc2626; cursor: pointer; font-size: 1.1rem; }

    .course-grid, .year-grid, .subject-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 26px;
    }

    .card, .subject-card, .chapter-card, .panel, .article {
      background: var(--medical-card); border: 1px solid var(--slate-200); border-radius: 22px; box-shadow: 0 10px 22px rgba(15, 23, 42, 0.04);
    }
    body.dark .card, body.dark .subject-card, body.dark .chapter-card, body.dark .panel, body.dark .article {
      background: var(--dark-card); border-color: var(--slate-700);
    }

    .course-card {
      padding: 28px; text-align: left; display: flex; align-items: flex-start; gap: 18px; cursor: pointer; transition: 0.2s ease; min-height: 180px;
    }
    .course-card:hover, .subject-card:hover, .chapter-card:hover {
      border-color: var(--medical-teal); transform: translateY(-2px); box-shadow: 0 18px 32px rgba(14, 116, 144, 0.08);
    }
    body.dark .course-card:hover, body.dark .subject-card:hover, body.dark .chapter-card:hover {
      border-color: var(--cyan-500);
    }

    .course-icon, .subject-icon, .chapter-number {
      width: 64px; height: 64px; border-radius: 18px; background: #ecfeff; color: var(--medical-teal); display: grid; place-items: center; font-size: 2rem; flex-shrink: 0;
    }
    body.dark .course-icon, body.dark .subject-icon, body.dark .chapter-number {
      background: var(--slate-700); color: var(--cyan-400);
    }
    .course-card h3, .subject-card h3, .chapter-card h3 { margin: 0 0 10px; font-size: 1.3rem; }
    .course-card p, .subject-card p, .chapter-meta { margin: 0; color: var(--medical-muted); }
    body.dark .course-card p, body.dark .subject-card p, body.dark .chapter-meta { color: var(--dark-muted); }
    .course-card .cta {
      color: var(--medical-teal); font-weight: 700; margin-top: 12px; display: inline-block;
    }
    body.dark .course-card .cta { color: var(--cyan-400); }

    .disabled-card {
      padding: 28px; opacity: 0.5; cursor: not-allowed; border: 1px dashed var(--slate-300); background: #f8fafc; border-radius: 22px;
    }
    body.dark .disabled-card { border-color: var(--slate-700); background: var(--slate-700); }
    .iq-card {
      padding: 28px; color: white; background: linear-gradient(135deg, #0d9488, #0284c7);
      border-radius: 22px; box-shadow: 0 16px 30px rgba(13, 148, 136, 0.22); text-align: left;
      cursor: pointer; transition: 0.2s ease;
    }
    .iq-card:hover { transform: translateY(-4px); }
    .iq-card h3 { margin: 0 0 10px; font-size: 1.3rem; }
    .iq-card p { margin: 0 0 18px; opacity: 0.9; }
    .iq-card .iq-icon { font-size: 2rem; margin-bottom: 18px; }
    .quiz-page { max-width: 760px; margin: 0 auto; padding: 0 24px 50px; }
    .quiz-card { padding: 30px; }
    .quiz-card h2 { margin: 0 0 8px; }
    .quiz-question { font-size: 1.25rem; font-weight: 700; margin: 26px 0 18px; }
    .quiz-options { display: grid; gap: 12px; }
    .quiz-option { width: 100%; border: 1px solid var(--slate-200); background: transparent; color: inherit; border-radius: 12px; padding: 14px; text-align: left; cursor: pointer; }
    body.dark .quiz-option { border-color: var(--slate-700); }
    .quiz-option:hover, .quiz-option.selected { border-color: var(--primary-color); background: rgba(13, 148, 136, 0.08); }
    .quiz-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
    .quiz-result { text-align: center; padding: 24px; }

    .year-card {
      padding: 32px 24px; text-align: center; cursor: pointer; transition: 0.2s ease;
    }
    .year-icon {
      width: 78px; height: 78px; border-radius: 50%; background: #ecfeff; color: var(--medical-teal); display: grid; place-items: center; margin: 0 auto 22px; font-size: 2.3rem;
    }
    body.dark .year-icon { background: var(--slate-700); color: var(--cyan-400); }
    .year-card h3 { margin: 0 0 10px; font-size: 2rem; }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(0, 2fr);
      gap: 30px;
      max-width: 1200px; margin: 0 auto;
      padding: 0 24px;
    }
    .panel {
      padding: 28px; position: sticky; top: 30px; height: fit-content;
    }
    .side-panel .subject-icon {
      width: 76px; height: 76px; border-radius: 20px; font-size: 2.5rem; margin-bottom: 20px;
    }
    .side-panel h2 { margin: 0 0 20px; font-size: 2.2rem; }
    .meta-list { display: grid; gap: 14px; }
    .meta-item {
      display: flex; align-items: center; gap: 12px; color: var(--medical-teal); font-weight: 700;
    }
    body.dark .meta-item { color: var(--cyan-400); }
    .meta-item.muted { color: var(--medical-muted); opacity: 0.7; }
    body.dark .meta-item.muted { color: var(--dark-muted); }

    .search-wrap { position: relative; margin-bottom: 22px; }
    .search-wrap i {
      position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--medical-muted);
    }
    body.dark .search-wrap i { color: var(--dark-muted); }
    .search-wrap input {
      width: 100%; background: var(--medical-card); border: 1px solid var(--slate-200); border-radius: 18px; padding: 18px 18px 18px 46px; font-size: 1rem; color: inherit;
    }
    body.dark .search-wrap input {
      background: var(--dark-card); border-color: var(--slate-700);
    }

    .chapter-card {
      width: 100%; cursor: pointer; padding: 20px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; transition: 0.2s ease;
    }
    .chapter-left { display: flex; align-items: center; gap: 18px; flex: 1; min-width: 0; }
    .chapter-number {
      width: 44px; height: 44px; border-radius: 50%; font-weight: 700; font-size: 1rem;
    }
    .chapter-text { min-width: 0; flex: 1; }
    .chapter-text h3 { font-size: 1.15rem; }
    .chapter-text p {
      margin: 0; color: var(--medical-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    }
    body.dark .chapter-text p { color: var(--dark-muted); }
    .chapter-actions { display: flex; align-items: center; gap: 10px; }
    .bookmark-btn, .nav-btn {
      border: none; background: none; cursor: pointer; font-size: 1.5rem; color: var(--slate-300); transition: 0.2s ease;
    }
    .bookmark-btn.active { color: var(--amber-500); }
    .chapter-card .arrow { color: var(--slate-300); font-size: 1.2rem; }
    body.dark .bookmark-btn, body.dark .chapter-card .arrow { color: var(--slate-600); }

    .empty-state {
      text-align: center; padding: 44px 18px; color: var(--medical-muted);
    }
    body.dark .empty-state { color: var(--dark-muted); }

    .article-shell {
      max-width: 900px; margin: 0 auto; padding: 0 24px 40px;
    }
    .article {
      padding: 30px 28px; border-radius: 28px;
    }
    .article-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; }
    .article-header h2 { margin: 0; font-size: clamp(2rem, 3vw, 2.7rem); }
    .article .highlight {
      background: #fffbeb; border-left: 4px solid var(--amber-500); padding: 18px 18px 18px 20px; border-radius: 0 16px 16px 0; margin-bottom: 26px;
    }
    body.dark .article .highlight { background: rgba(217, 119, 6, 0.12); }
    .article .highlight strong { display: block; margin-bottom: 5px; color: var(--amber-700); }
    body.dark .article .highlight strong { color: #fbbf24; }
    .article-content { display: grid; gap: 14px; line-height: 1.8; color: var(--medical-muted); }
    body.dark .article-content { color: var(--dark-muted); }
    .article-content h3 { margin: 12px 0 0; color: var(--medical-text); font-size: 1.45rem; }
    body.dark .article-content h3 { color: var(--dark-text); }
    .article-content ul { margin: 0; padding-left: 24px; display: grid; gap: 8px; }
    .article .divider { width: 90px; height: 5px; background: var(--medical-teal); border-radius: 999px; margin-bottom: 26px; }
    body.dark .article .divider { background: var(--cyan-500); }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px; margin: 0 auto 20px; max-width: 900px; padding: 0 24px; color: var(--medical-teal); background: none; border: none; cursor: pointer; font-weight: 700;
    }
    body.dark .back-link { color: var(--cyan-400); }

    @media (max-width: 760px) {
      .header-inner { padding: 20px 0; }
      .main-grid { grid-template-columns: 1fr; }
      .panel { position: static; }
      .article-header { flex-direction: column; }
      .chapter-card { align-items: flex-start; }
      .chapter-actions { margin-left: auto; }
      .dashboard-hero { align-items: flex-start; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .dashboard-controls { grid-template-columns: 1fr; }
      .streak-badge { width: 92px; height: 92px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div>
        <h1>PharmaHype</h1>
        <p>Your Ultimate Pharmacy &amp; Medical Learning Portal</p>
      </div>
      <div class="header-actions">
        <button class="account-btn" id="accountToggle" aria-label="Open account">Account</button>
        <button class="settings-btn" id="settingsToggle" aria-label="Open appearance settings">⚙</button>
        <button class="theme-btn" id="themeToggle" aria-label="Toggle theme">☾</button>
      </div>
    </div>
  </header>

  <div id="app" class="page-shell"></div>

  <script>
    const dPharmContent = {
      firstYear: {
        title: 'D.Pharm First Year',
        subjects: [
          {
            id: 'pharmaceutics-i',
            name: 'Pharmaceutics',
            icon: '💊',
            sections: [
              {
                title: 'Introduction to Pharmacy',
                content: 'History of pharmacy profession in India, the development of pharmacy education, and pharmacopoeial standards.',
                important: 'Remember Prof. Mahadeva Lal Schroff as the pioneer of pharmacy education in India.',
                contentHtml: `
                  <h3>History of Pharmacy in India</h3>
                  <p>Pharmacy profession in India has evolved significantly over the decades. The foundation of modern pharmacy education was laid by <strong>Mahadeva Lal Schroff</strong>, who is widely regarded as the father of pharmacy education in India. He introduced the first university-level pharmacy course at Banaras Hindu University (BHU).</p>
                  <p>Over time, the profession shifted from simple compounding to highly regulated clinical and industrial practices, regulated today by the Pharmacy Council of India (PCI).</p>
                  <h3>Pharmacopoeia</h3>
                  <p>A Pharmacopoeia is an official book of standards for drugs and medicines. It provides guidelines for the identification, purity, and formulation of pharmaceutical substances.</p>
                  <ul>
                    <li><strong>IP (Indian Pharmacopoeia):</strong> The official book of standards for drugs in India.</li>
                    <li><strong>BP (British Pharmacopoeia):</strong> Sets standards followed in the UK and several Commonwealth nations.</li>
                    <li><strong>USP (United States Pharmacopoeia):</strong> The official standard book for the USA.</li>
                  </ul>
                `
              },
              {
                title: 'Packaging Materials',
                content: 'Glass, plastic, metal, and rubber packaging materials used to protect medicines and maintain their stability.',
                contentHtml: `
                  <p>Pharmaceutical packaging materials protect medicines from light, moisture, contamination, damage, and chemical change.</p>
                  <h3>Glass Packaging</h3>

          <button data-action="go-home">Home</button>
          ${state.course ? '<span class="crumb-sep">›</span><button data-action="go-year-select">D-PHARM</button>' : ''}
          ${state.year ? '<span class="crumb-sep">›</span><button data-action="go-subject-list">' + escapeHtml(yearLabel) + '</button>' : ''}
          ${state.subject ? '<span class="crumb-sep">›</span><span>' + escapeHtml(state.subject.name) + '</span>' : ''}
        </nav>
      `;
    }

    function renderSubjectList() {
      const yearKey = state.year === 'first-year' ? 'firstYear' : 'secondYear';
      const data = dPharmContent[yearKey];
      return `
        <div class="container">
          <div class="section-title">
            <h2>${escapeHtml(data.title)}</h2>
            <p style="color: var(--medical-muted); margin: 0;">Select a subject to view chapters and notes.</p>
            <div class="section-divider" style="margin-top: 16px;"></div>
          </div>
          <div class="subject-grid">
            ${data.subjects.map(subject => `
              <button class="subject-card card" data-action="open-subject" data-subject-id="${subject.id}" style="padding: 24px; display: flex; align-items: center; justify-content: space-between; width: 100%; border: 1px solid var(--slate-200); cursor: pointer; text-align: left;">
                <div class="subject-icon" style="font-size: 2rem;">${subject.icon}</div>
                <div style="flex: 1; min-width: 0; margin-left: 12px;">
                  <h3>${escapeHtml(subject.name)}</h3>
                  <p>View all topics &amp; study material</p>
                </div>
                <div style="font-size: 1.4rem; color: var(--slate-300);">›</div>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderSubjectDetail() {
      if (!state.subject) return '';
      const filtered = state.subject.sections.filter(section => {
        const target = (section.title + ' ' + section.content).toLowerCase();
        return target.includes(state.search.toLowerCase());
      });

      return `
        <div class="main-grid">
          <aside class="panel side-panel">
            <div class="subject-icon">${state.subject.icon}</div>
            <h2>${escapeHtml(state.subject.name)}</h2>
            <div class="meta-list">
              <div class="meta-item"><span>📖</span><span>${state.subject.sections.length} Chapters in this subject</span></div>
              <div class="meta-item muted"><span>📝</span><span>Viva Questions (Coming Soon)</span></div>
              <div class="meta-item muted"><span>📄</span><span>Past Papers (Coming Soon)</span></div>
            </div>
          </aside>

          <main>
            <div class="search-wrap">
              <i>🔎</i>
              <input type="text" id="searchInput" value="${escapeHtml(state.search)}" placeholder="Search chapters or topics..." />
            </div>

            ${filtered.length ? filtered.map((section, index) => `
              <button class="chapter-card" data-action="open-section" data-section-index="${state.subject.sections.indexOf(section)}" style="margin-bottom: 18px;">
                <div class="chapter-left">
                  <div class="chapter-number">${index + 1}</div>
                  <div class="chapter-text">
                    <h3>${escapeHtml(section.title)}</h3>
                    <p>${escapeHtml(section.content.slice(0, 140))}${section.content.length > 140 ? '...' : ''}</p>
                  </div>
                </div>
                <div class="chapter-actions">
                  ${section.important ? '<span style="background: var(--amber-100); color: var(--amber-700); border-radius: 999px; padding: 6px 10px; font-size: 0.7rem; font-weight: 700;">★ Important</span>' : ''}
                  <button class="bookmark-btn ${state.bookmarks.includes(section.title) ? 'active' : ''}" data-action="toggle-bookmark" data-bookmark-title="${escapeHtml(section.title)}" aria-label="Bookmark chapter">★</button>
                  <span class="arrow">›</span>
                </div>
              </button>
            `).join('') : `
              <div class="empty-state">
                <div style="font-size: 3rem; opacity: 0.5; margin-bottom: 12px;">📦</div>
                <p>No chapters found matching your search.</p>
              </div>
            `}
          </main>
        </div>
      `;
    }

    function renderReadingView() {
      if (!state.section) return '';
      return `
        <div class="article-shell">
          <button class="back-link" data-action="close-section">← Back to Chapters</button>
          <article class="article">
            <div class="article-header">
              <h2>${escapeHtml(state.section.title)}</h2>
              <button class="bookmark-btn ${state.bookmarks.includes(state.section.title) ? 'active' : ''}" data-action="toggle-bookmark" data-bookmark-title="${escapeHtml(state.section.title)}" aria-label="Bookmark chapter" style="font-size: 2rem;">★</button>
            </div>

            ${state.section.important ? `
              <div class="highlight">
                <strong>Important Highlight</strong>
                <span>${escapeHtml(state.section.important)}</span>
              </div>
            ` : ''}

            <div class="divider"></div>
            <div class="article-content">
              ${state.section.contentHtml || state.section.content.split('\n').map(paragraph => `<p>${escapeHtml(paragraph || ' ')}</p>`).join('')}
            </div>
          </article>
        </div>
      `;
    }

    function render() {
      const viewMap = {
        landing: renderLanding,
        dashboard: renderDashboard,
        auth: renderAuth,
        settings: renderSettings,
        quiz: renderQuiz,
        'year-select': renderYearSelect,
        'subject-list': renderSubjectList,
        'subject-detail': renderSubjectDetail,
        'reading-view': renderReadingView
      };

      const content = state.section ? renderReadingView() : viewMap[state.view] ? viewMap[state.view]() : '';
      app.innerHTML = `
        ${renderBreadcrumbs()}
        ${content}
      `;
      setDarkTheme();
      applySettings();

      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', (event) => {
          state.search = event.target.value;
          render();
        });
      }
      const profileUpload = document.getElementById('profileUpload');
      if (profileUpload) {
        profileUpload.addEventListener('change', (event) => {
          const file = event.target.files && event.target.files[0];
          if (!file) return;
          if (!file.type.startsWith('image/')) return;
          const reader = new FileReader();
          reader.onload = () => {
            state.user.photo = String(reader.result);
            saveUser();
            render();
          };
          reader.readAsDataURL(file);
        });
      }
      const noteUpload = document.getElementById('noteUpload');
      if (noteUpload) {
        noteUpload.addEventListener('change', (event) => {
          const file = event.target.files && event.target.files[0];
          if (!file) return;
          const allowed = ['application/pdf', 'text/plain', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
          const extensionAllowed = /\.(pdf|txt|docx)$/i.test(file.name);
          if (!allowed.includes(file.type) && !extensionAllowed) return;
          state.notes.push({ name: file.name });
          saveNotes();
          render();
        });
      }
      const intensitySlider = document.getElementById('intensitySlider');
      const colorSelect = document.getElementById('colorSelect');
      const fontSelect = document.getElementById('fontSelect');
      if (intensitySlider) {
        intensitySlider.addEventListener('input', (event) => {
          state.settings.intensity = event.target.value;
          applySettings();
        });
      }
      if (colorSelect) {
        colorSelect.addEventListener('change', (event) => {
          state.settings.color = event.target.value;
          applySettings();
        });
      }
      if (fontSelect) {
        fontSelect.addEventListener('change', (event) => {
          state.settings.font = event.target.value;
          applySettings();
        });
      }
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      state.dark = !state.dark;
      setDarkTheme();
    });
    document.getElementById('settingsToggle').addEventListener('click', () => {
      state.view = 'settings';
      state.section = null;
      render();
    });
    document.getElementById('accountToggle').addEventListener('click', () => {
      state.view = 'auth';
      state.authMessage = '';
      render();
    });

    document.addEventListener('click', (event) => {
      const target = event.target.closest('[data-action]');
      if (!target) return;

      const action = target.dataset.action;
      if (action === 'select-course') {
        state.course = target.dataset.course;
        state.view = 'year-select';
        state.year = null;
        state.subject = null;
        state.section = null;
        state.search = '';
        render();
      }

      if (action === 'open-dashboard') {
        state.view = 'dashboard';
        state.section = null;
        render();
      }

      if (action === 'open-quiz') {
        state.view = 'quiz';
        state.quizIndex = 0;
        state.quizScore = 0;
        state.quizAnswer = null;
        state.quizFinished = false;
        render();
      }

      if (action === 'select-quiz-option') {
        state.quizAnswer = Number(target.dataset.optionIndex);
        render();
      }

      if (action === 'next-quiz') {
        if (state.quizAnswer === null) return;
        const current = quizQuestions[state.quizIndex];
        if (state.quizAnswer === current.answer) state.quizScore += 1;
        if (state.quizIndex === quizQuestions.length - 1) {
          state.quizFinished = true;
        } else {
          state.quizIndex += 1;
          state.quizAnswer = null;
        }
        render();
      }

      if (action === 'restart-quiz') {
        state.quizIndex = 0;
        state.quizScore = 0;
        state.quizAnswer = null;
        state.quizFinished = false;
        render();
      }

      if (action === 'open-account') {
        state.view = 'auth';
        state.authMode = 'login';
        state.authMessage = '';
        render();
      }

      if (action === 'toggle-auth') {
        state.authMode = state.authMode === 'login' ? 'signup' : 'login';
        state.authMessage = '';
        render();
      }

      if (action === 'save-settings') {
        saveSettings();
        const status = document.getElementById('settingsStatus');
        if (status) status.textContent = 'Preferences saved.';
      }

      if (action === 'toggle-timer') {
        if (state.timerRunning) {
          clearInterval(state.timerInterval);
          state.timerInterval = null;
          state.timerRunning = false;
          render();
        } else {
          state.timerRunning = true;
          state.timerInterval = setInterval(() => {
            if (state.timerSeconds > 0) {
              state.timerSeconds -= 1;
              render();
            } else {
              clearInterval(state.timerInterval);
              state.timerInterval = null;
              state.timerRunning = false;
              state.todayMinutes += state.timerMinutes;
              saveStudyProgress();
              render();
              alert('Focus session complete!');
            }
          }, 1000);
          render();
        }
      }

      if (action === 'set-timer') {
        const input = document.getElementById('customMinutes');
        const minutes = Number(input && input.value);
        if (Number.isInteger(minutes) && minutes >= 1 && minutes <= 120) {
          clearInterval(state.timerInterval);
          state.timerInterval = null;
          state.timerRunning = false;
          state.timerMinutes = minutes;
          state.timerSeconds = minutes * 60;
          render();
        } else if (input) {
          input.focus();
          input.setCustomValidity('Choose a duration from 1 to 120 minutes.');
          input.reportValidity();
          input.setCustomValidity('');
        }
      }

      if (action === 'reset-timer') {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
        state.timerRunning = false;
        state.timerSeconds = state.timerMinutes * 60;
        render();
      }

      if (action === 'add-hour') {
        state.todayMinutes += 60;
        saveStudyProgress();
        render();
      }

      if (action === 'complete-study') {
        if (state.todayMinutes > state.recordMinutes) {
          state.recordMinutes = state.todayMinutes;
          saveStudyProgress();
          alert('Congratulations! You broke your study record!');
        } else if (state.todayMinutes > 0) {
          alert('Good job! Keep it up!');
        } else {
          alert('Please study first before completing!');
        }

        if (action === 'remove-note') {
          state.notes.splice(Number(target.dataset.noteIndex), 1);
          saveNotes();
          render();
        }
      }

      if (action === 'select-year') {
        state.year = target.dataset.year;
        state.view = 'subject-list';
        state.subject = null;
        state.section = null;
        state.search = '';
        render();
      }

      if (action === 'go-home') {
        state.view = 'landing';
        state.course = null;
        state.year = null;
        state.subject = null;
        state.section = null;
        state.search = '';
        render();
      }

      if (action === 'go-year-select') {
        state.view = 'year-select';
        state.year = null;
        state.subject = null;
        state.section = null;
        state.search = '';
        render();
      }

      if (action === 'go-subject-list') {
        state.view = 'subject-list';
        state.subject = null;
        state.section = null;
        state.search = '';
        render();
      }

      if (action === 'open-subject') {
        const subjectId = target.dataset.subjectId;
        const yearKey = state.year === 'first-year' ? 'firstYear' : 'secondYear';
        const subject = dPharmContent[yearKey].subjects.find(item => item.id === subjectId);
        state.subject = subject;
        state.view = 'subject-detail';
        state.section = null;
        state.search = '';
        render();
      }

      if (action === 'open-section') {
        const yearKey = state.year === 'first-year' ? 'firstYear' : 'secondYear';
        const subject = dPharmContent[yearKey].subjects.find(item => item.id === state.subject.id);
        const index = Number(target.dataset.sectionIndex);
        state.section = subject.sections[index];
        state.view = 'reading-view';
        render();
      }

      if (action === 'close-section') {
        state.section = null;
        state.view = 'subject-detail';
        render();
      }

      if (action === 'toggle-bookmark') {
        const title = target.dataset.bookmarkTitle || target.closest('[data-bookmark-title]')?.dataset.bookmarkTitle;
        toggleBookmark(title);
      }
    });

    document.addEventListener('submit', (event) => {
      if (event.target.dataset.action !== 'submit-auth') return;
      event.preventDefault();
      const formData = new FormData(event.target);
      const email = String(formData.get('email') || '').trim();
      const name = String(formData.get('name') || '').trim();
      if (state.authMode === 'signup') {
        const displayName = name || 'Student Name';
        state.user = {
          name: displayName,
          email,
          initials: displayName.split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0].toUpperCase()).join('') || 'S'
        };
        saveUser();
        state.authMessage = 'Account created successfully!';
      } else {
        state.user.email = email || state.user.email;
        saveUser();
        state.authMessage = 'Login successful!';
      }
      state.view = 'dashboard';
      render();
    });

    render();
  </script>
</body>
</html>
