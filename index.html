<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaHype - D.Pharm Study Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        medical: {
                            teal: '#0e7490',
                            light: '#0891b2',
                            bg: '#f8fafc',
                            card: '#ffffff',
                            text: '#1e293b',
                            muted: '#64748b'
                        },
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            text: '#f1f5f9',
                            muted: '#94a3b8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #334155; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #475569; }
    </style>
</head>
<body class="bg-medical-bg text-medical-text dark:bg-dark-bg dark:text-dark-text font-sans transition-colors duration-300">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom-production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const readStoredBookmarks = () => {
            try {
                const raw = localStorage.getItem('pharmaBookmarks');
                return raw ? JSON.parse(raw) : [];
            } catch (error) {
                return [];
            }
        };

        const dPharmContent = {
            firstYear: {
                title: "D.Pharm First Year",
                subjects: [
                    {
                        id: "pharmaceutics-i",
                        name: "Pharmaceutics",
                        icon: "fa-pills",
                        sections: [
                            {
                                title: "Introduction to Pharmaceutics",
                                content: "Pharmaceutics is the science of dosage form design. It involves turning a pure drug substance into a safe and effective medicine that a patient can take.\n\nKey Definition:\n'Drug' is the active chemical ingredient that cures the disease.\n'Medicine' is the final product containing the drug plus other inactive ingredients (excipients) designed for easy use by the patient.",
                                important: "Remember the basic difference between Drug and Medicine for your viva."
                            },
                            {
                                title: "Prescription",
                                content: "A prescription is a written order from a registered medical practitioner to a pharmacist, instructing them to compound and dispense medication to a specific patient.\n\nMajor parts of a prescription:\n1. Prescriber Information\n2. Patient Details\n3. Superscription (Rx symbol)\n4. Inscription (Main medication name & strength)\n5. Subscription (Instructions to pharmacist)\n6. Signatura (Instructions to patient)",
                                important: "Be ready to name all 6 parts of a prescription during viva."
                            },
                            {
                                title: "Dosage Forms",
                                content: "Dosage forms are the physical forms in which a medicine is produced and presented. They include liquid forms (syrups, suspensions), solid forms (tablets, capsules), and semi-solid forms (creams, ointments)."
                            }
                        ]
                    },
                    {
                        id: "pharmaceutical-chemistry",
                        name: "Pharmaceutical Chemistry",
                        icon: "fa-flask",
                        sections: [
                            {
                                title: "Introduction to Pharmaceutical Chemistry",
                                content: "Pharmaceutical Chemistry involves the study of drugs from a chemical perspective. This includes their structure, synthesis, and how they react within the body. We look at different chemical groups and how they affect the drug's action."
                            },
                            {
                                title: "Sources of Impurities",
                                content: "Impurities are unwanted chemicals that remain in the medicine. They can come from raw materials, the manufacturing process, or storage conditions. Controlling impurities is crucial for patient safety."
                            }
                        ]
                    },
                    {
                        id: "pharmacognosy",
                        name: "Pharmacognosy",
                        icon: "fa-leaf",
                        sections: [
                            {
                                title: "Introduction to Pharmacognosy",
                                content: "Pharmacognosy is the study of medicinal drugs derived from plants and other natural sources. It covers the history, production, and chemical composition of natural remedies like herbs, roots, and essential oils."
                            },
                            {
                                title: "Plant Constituents",
                                content: "These are the active chemical compounds found in plants that provide medicinal effects. Common examples include alkaloids, glycosides, and volatile oils."
                            }
                        ]
                    },
                    {
                        id: "hap",
                        name: "Human Anatomy & Physiology",
                        icon: "fa-user-nurse",
                        sections: [
                            {
                                title: "Introduction to Human Anatomy and Physiology",
                                content: "Human Anatomy is the study of the physical structure of the human body (organs, bones, muscles). Physiology is the study of how these structures work and interact to keep us alive."
                            },
                            {
                                title: "The Cell",
                                content: "The cell is the basic structural and functional unit of all living organisms. We study the parts of the cell and their functions, as well as how cells divide and communicate."
                            }
                        ]
                    },
                    {
                        id: "social-pharmacy",
                        name: "Social Pharmacy",
                        icon: "fa-users",
                        sections: [
                            {
                                title: "Introduction to Social Pharmacy",
                                content: "Social Pharmacy deals with the role of pharmacy and medicines in society. It covers public health, health promotion, disease prevention, and the pharmacist's responsibility to the community."
                            },
                            {
                                title: "National Health Programs",
                                content: "Various programs implemented by the government to control and prevent widespread diseases in society, such as tuberculosis, polio, and HIV/AIDS."
                            }
                        ]
                    }
                ]
            },
            secondYear: {
                title: "D.Pharm Second Year",
                subjects: [
                    {
                        id: "pharmacology",
                        name: "Pharmacology",
                        icon: "fa-syringe",
                        sections: [
                            {
                                title: "Introduction to Pharmacology",
                                content: "Pharmacology is the study of how drugs interact with living systems. It combines 'Pharmacokinetics' (what the body does to the drug) and 'Pharmacodynamics' (what the drug does to the body)."
                            },
                            {
                                title: "Routes of Drug Administration",
                                content: "The different ways a drug can enter the body, such as oral (swallowing), intravenous (injection into the vein), transdermal (skin patches), and intramuscular (injection into the muscle)."
                            }
                        ]
                    },
                    {
                        id: "community-pharmacy",
                        name: "Community Pharmacy & Management",
                        icon: "fa-hospital-user",
                        sections: [
                            {
                                title: "Introduction to Community Pharmacy",
                                content: "A community pharmacy is a retail store that dispenses medications and offers health advice to members of the general population. The community pharmacist acts as an accessible healthcare provider."
                            },
                            {
                                title: "Good Pharmacy Practice (GPP)",
                                content: "Standards that community pharmacists must follow to ensure they provide optimal professional care to patients."
                            }
                        ]
                    },
                    {
                        id: "biochemistry",
                        name: "Biochemistry & Clinical Pathology",
                        icon: "fa-dna",
                        sections: [
                            {
                                title: "Introduction to Biochemistry",
                                content: "Biochemistry is the study of chemical processes within and relating to living organisms. It bridges biology and chemistry, focusing on cellular components like proteins, carbohydrates, lipids, and nucleic acids."
                            },
                            {
                                title: "Carbohydrates Metabolism",
                                content: "How the body processes and breaks down sugars and starches to produce energy for daily functions."
                            }
                        ]
                    },
                    {
                        id: "pharmacotherapeutics",
                        name: "Pharmacotherapeutics",
                        icon: "fa-briefcase-medical",
                        sections: [
                            {
                                title: "Introduction to Pharmacotherapeutics",
                                content: "Pharmacotherapeutics is the study of the therapeutic uses and effects of drugs. It focuses on selecting the appropriate drug and dosage for a specific patient's condition based on clinical evidence."
                            },
                            {
                                title: "Individualized Dosing",
                                content: "Adjusting drug dosages to match a patient's individual characteristics, such as age, weight, and kidney function."
                            }
                        ]
                    },
                    {
                        id: "hospital-pharmacy",
                        name: "Hospital & Clinical Pharmacy",
                        icon: "fa-clinic-medical",
                        sections: [
                            {
                                title: "Introduction to Hospital Pharmacy",
                                content: "Hospital pharmacy is a specialized field where the pharmacist operates within a hospital environment. This includes managing inpatient medications, preparing IV solutions, and collaborating with doctors and nurses."
                            },
                            {
                                title: "Formulary System",
                                content: "An officially approved list of medicines and therapies maintained by the hospital to ensure safe and cost-effective medication use."
                            }
                        ]
                    },
                    {
                        id: "law-ethics",
                        name: "Pharmacy Law & Ethics",
                        icon: "fa-gavel",
                        sections: [
                            {
                                title: "Introduction to Pharmacy Law",
                                content: "Pharmacy Law covers the legal regulations governing the manufacture, sale, and distribution of medicines. Ethics focus on the moral responsibilities of the pharmacist towards the patient and healthcare system."
                            },
                            {
                                title: "The Drugs and Cosmetics Act, 1940",
                                content: "A vital legislative act in India regulating the import, manufacture, distribution, and sale of drugs and cosmetics to ensure quality and standard."
                            }
                        ]
                    }
                ]
            }
        };

        const App = () => {
            const [view, setView] = useState('landing');
            const [course, setCourse] = useState(null);
            const [year, setYear] = useState(null);
            const [subject, setSubject] = useState(null);
            const [section, setSection] = useState(null);
            const [isDark, setIsDark] = useState(false);
            const [bookmarks, setBookmarks] = useState(readStoredBookmarks);
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDark]);

            useEffect(() => {
                localStorage.setItem('pharmaBookmarks', JSON.stringify(bookmarks));
            }, [bookmarks]);

            const resetSearch = () => setSearchTerm('');

            const goHome = () => {
                setView('landing');
                setCourse(null);
                setYear(null);
                setSubject(null);
                setSection(null);
                resetSearch();
            };

            const selectCourse = () => {
                setCourse('d-pharm');
                setYear(null);
                setSubject(null);
                setSection(null);
                resetSearch();
                setView('year-select');
            };

            const selectYear = (selectedYear) => {
                setYear(selectedYear);
                setSubject(null);
                setSection(null);
                resetSearch();
                setView('subject-list');
            };

            const selectSubject = (selectedSubject) => {
                setSubject(selectedSubject);
                setSection(null);
                resetSearch();
                setView('subject-detail');
            };

            const toggleBookmark = (secTitle, e) => {
                if (e) e.stopPropagation();
                if (bookmarks.includes(secTitle)) {
                    setBookmarks(bookmarks.filter((b) => b !== secTitle));
                } else {
                    setBookmarks([...bookmarks, secTitle]);
                }
            };

            const toggleTheme = () => setIsDark(!isDark);

            const renderHeader = () => (
                <header className="bg-medical-teal dark:bg-dark-card text-white shadow-lg mb-8 transition-colors duration-300">
                    <div className="container mx-auto max-w-6xl py-6 px-6 flex items-center justify-between">
                        <div>
                            <h1 className="text-4xl font-extrabold tracking-tight mb-2">PharmaHype</h1>
                            <p className="text-cyan-100 text-lg font-medium">Your Ultimate Pharmacy & Medical Learning Portal</p>
                        </div>
                        <button
                            type="button"
                            onClick={toggleTheme}
                            className="w-12 h-12 rounded-full bg-cyan-600 dark:bg-slate-700 hover:bg-cyan-700 dark:hover:bg-slate-600 transition-colors duration-300 flex items-center justify-center text-xl shadow-md"
                        >
                            <i className={`fa-solid ${isDark ? 'fa-sun' : 'fa-moon'}`}></i>
                        </button>
                    </div>
                </header>
            );

            const renderBreadcrumbs = () => {
                if (view === 'landing') return null;
                return (
                    <nav className="text-sm text-medical-muted dark:text-dark-muted mb-6 font-medium flex items-center gap-2">
                        <button type="button" onClick={goHome} className="hover:text-medical-teal dark:hover:text-cyan-400 transition-colors">Home</button>
                        {course && (
                            <>
                                <i className="fa-solid fa-chevron-right text-xs text-slate-300 dark:text-slate-600"></i>
                                <button type="button" onClick={() => { setView('year-select'); setYear(null); setSubject(null); setSection(null); resetSearch(); }} className="hover:text-medical-teal dark:hover:text-cyan-400 transition-colors uppercase">{course}</button>
                            </>
                        )}
                        {year && (
                            <>
                                <i className="fa-solid fa-chevron-right text-xs text-slate-300 dark:text-slate-600"></i>
                                <button type="button" onClick={() => { setView('subject-list'); setSubject(null); setSection(null); resetSearch(); }} className="hover:text-medical-teal dark:hover:text-cyan-400 transition-colors capitalize">{year.replace('-', ' ')}</button>
                            </>
                        )}
                        {subject && (
                            <>
                                <i className="fa-solid fa-chevron-right text-xs text-slate-300 dark:text-slate-600"></i>
                                <span className="text-medical-text dark:text-dark-text font-semibold">{subject.name}</span>
                            </>
                        )}
                    </nav>
                );
            };

            const renderLanding = () => (
                <div className="container mx-auto max-w-6xl px-6 pb-12">
                    <div className="text-center mb-12">
                        <h2 className="text-3xl font-bold mb-4">Choose Your Course</h2>
                        <div className="w-24 h-1 bg-medical-teal dark:bg-cyan-500 mx-auto rounded-full"></div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <button
                            type="button"
                            onClick={selectCourse}
                            className="group bg-white dark:bg-dark-card p-8 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 hover:border-medical-teal dark:hover:border-cyan-500 hover:shadow-cyan-100 dark:hover:shadow-none hover:shadow-xl transition-all duration-300 text-left flex items-start gap-6"
                        >
                            <div className="w-16 h-16 rounded-full bg-cyan-50 dark:bg-slate-700 text-medical-teal dark:text-cyan-400 flex items-center justify-center text-3xl group-hover:bg-medical-teal dark:group-hover:bg-cyan-500 group-hover:text-white dark:group-hover:text-slate-900 transition-all duration-300">
                                <i className="fa-solid fa-mortar-pestle"></i>
                            </div>
                            <div>
                                <h3 className="text-2xl font-bold mb-1">D.Pharm</h3>
                                <p className="text-medical-muted dark:text-dark-muted mb-4">Diploma in Pharmacy Study Materials, Notes, and Exam Prep.</p>
                                <span className="text-medical-teal dark:text-cyan-400 font-semibold group-hover:translate-x-1 inline-block transition-transform">Get Started <i className="fa-solid fa-arrow-right ml-1"></i></span>
                            </div>
                        </button>

                        <div className="opacity-50 cursor-not-allowed bg-slate-100 dark:bg-slate-800 p-8 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700 flex items-start gap-6">
                            <div className="w-16 h-16 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-400 dark:text-slate-500 flex items-center justify-center text-3xl">
                                <i className="fa-solid fa-graduation-cap"></i>
                            </div>
                            <div>
                                <h3 className="text-2xl font-bold text-slate-400 dark:text-slate-500 mb-1">B.Pharm</h3>
                                <p className="text-slate-400 dark:text-slate-500 mb-4">Bachelor in Pharmacy - Coming Soon.</p>
                            </div>
                        </div>

                        <div className="opacity-50 cursor-not-allowed bg-slate-100 dark:bg-slate-800 p-8 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700 flex items-start gap-6">
                            <div className="w-16 h-16 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-400 dark:text-slate-500 flex items-center justify-center text-3xl">
                                <i className="fa-solid fa-flask-vial"></i>
                            </div>
                            <div>
                                <h3 className="text-2xl font-bold text-slate-400 dark:text-slate-500 mb-1">M.Pharm</h3>
                                <p className="text-slate-400 dark:text-slate-500 mb-4">Master in Pharmacy - Coming Soon.</p>
                            </div>
                        </div>

                        <div className="opacity-50 cursor-not-allowed bg-slate-100 dark:bg-slate-800 p-8 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700 flex items-start gap-6">
                            <div className="w-16 h-16 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-400 dark:text-slate-500 flex items-center justify-center text-3xl">
                                <i className="fa-solid fa-user-md"></i>
                            </div>
                            <div>
                                <h3 className="text-2xl font-bold text-slate-400 dark:text-slate-500 mb-1">Pharm.D</h3>
                                <p className="text-slate-400 dark:text-slate-500 mb-4">Doctor of Pharmacy - Coming Soon.</p>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderYearSelect = () => (
                <div className="container mx-auto max-w-4xl px-6 pb-12">
                    <div className="text-center mb-12">
                        <h2 className="text-3xl font-bold mb-4">Select Academic Year</h2>
                        <div className="w-24 h-1 bg-medical-teal dark:bg-cyan-500 mx-auto rounded-full"></div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <button
                            type="button"
                            onClick={() => selectYear('first-year')}
                            className="bg-white dark:bg-dark-card p-8 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 hover:border-medical-teal dark:hover:border-cyan-500 hover:shadow-cyan-100 dark:hover:shadow-none hover:shadow-xl transition-all duration-300 text-center"
                        >
                            <div className="w-20 h-20 rounded-full bg-cyan-50 dark:bg-slate-700 text-medical-teal dark:text-cyan-400 flex items-center justify-center text-4xl mx-auto mb-6">
                                <i className="fa-solid fa-1"></i>
                            </div>
                            <h3 className="text-2xl font-bold mb-2">First Year</h3>
                            <p className="text-medical-muted dark:text-dark-muted">Access all basic subjects, notes, and foundational topics.</p>
                        </button>

                        <button
                            type="button"
                            onClick={() => selectYear('second-year')}
                            className="bg-white dark:bg-dark-card p-8 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 hover:border-medical-teal dark:hover:border-cyan-500 hover:shadow-cyan-100 dark:hover:shadow-none hover:shadow-xl transition-all duration-300 text-center"
                        >
                            <div className="w-20 h-20 rounded-full bg-cyan-50 dark:bg-slate-700 text-medical-teal dark:text-cyan-400 flex items-center justify-center text-4xl mx-auto mb-6">
                                <i className="fa-solid fa-2"></i>
                            </div>
                            <h3 className="text-2xl font-bold mb-2">Second Year</h3>
                            <p className="text-medical-muted dark:text-dark-muted">Access advanced clinical subjects, pharmacology, and law.</p>
                        </button>
                    </div>
                </div>
            );

            const renderSubjectList = () => {
                const yearData = year === 'first-year' ? dPharmContent.firstYear : dPharmContent.secondYear;
                return (
                    <div className="container mx-auto max-w-6xl px-6 pb-12">
                        <div className="text-center mb-12">
                            <h2 className="text-3xl font-bold mb-2">{yearData.title}</h2>
                            <p className="text-medical-muted dark:text-dark-muted font-medium">Select a subject to view chapters and notes.</p>
                            <div className="w-24 h-1 bg-medical-teal dark:bg-cyan-500 mx-auto mt-6 rounded-full"></div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {yearData.subjects.map((sub) => (
                                <button
                                    type="button"
                                    key={sub.id}
                                    onClick={() => selectSubject(sub)}
                                    className="group bg-white dark:bg-dark-card p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 hover:border-medical-teal dark:hover:border-cyan-500 hover:shadow-cyan-50 dark:hover:shadow-none hover:shadow-lg transition-all duration-300 flex items-center gap-6"
                                >
                                    <div className="w-16 h-16 rounded-2xl bg-cyan-50 dark:bg-slate-700 text-medical-teal dark:text-cyan-400 flex items-center justify-center text-3xl group-hover:bg-medical-teal dark:group-hover:bg-cyan-500 group-hover:text-white dark:group-hover:text-slate-900 transition-colors duration-300">
                                        <i className={`fa-solid ${sub.icon}`}></i>
                                    </div>
                                    <div className="text-left flex-grow">
                                        <h3 className="text-lg font-bold group-hover:text-medical-teal dark:group-hover:text-cyan-400">{sub.name}</h3>
                                        <p className="text-medical-muted dark:text-dark-muted text-sm">View all topics & study material</p>
                                    </div>
                                    <i className="fa-solid fa-chevron-right text-slate-300 dark:text-slate-600 group-hover:text-medical-teal dark:group-hover:text-cyan-500"></i>
                                </button>
                            ))}
                        </div>
                    </div>
                );
            };

            const renderSubjectDetail = () => {
                const filteredSections = subject.sections.filter((sec) =>
                    sec.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    sec.content.toLowerCase().includes(searchTerm.toLowerCase())
                );

                return (
                    <div className="container mx-auto max-w-6xl px-6 pb-12">
                        <div className="flex flex-col md:flex-row gap-12">
                            <aside className="w-full md:w-1/3">
                                <div className="bg-white dark:bg-dark-card rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-8 sticky top-8 transition-colors duration-300">
                                    <div className="w-20 h-20 rounded-2xl bg-cyan-50 dark:bg-slate-700 text-medical-teal dark:text-cyan-400 flex items-center justify-center text-4xl mb-6">
                                        <i className={`fa-solid ${subject.icon}`}></i>
                                    </div>
                                    <h2 className="text-3xl font-bold mb-4">{subject.name}</h2>
                                    <div className="space-y-4">
                                        <div className="flex items-center gap-3 text-medical-teal dark:text-cyan-400 font-semibold">
                                            <i className="fa-solid fa-book-open"></i>
                                            <span>{subject.sections.length} Chapters in this subject</span>
                                        </div>
                                        <div className="flex items-center gap-3 text-medical-muted dark:text-dark-muted font-semibold opacity-50 cursor-not-allowed">
                                            <i className="fa-solid fa-clipboard-question"></i>
                                            <span>Viva Questions (Coming Soon)</span>
                                        </div>
                                        <div className="flex items-center gap-3 text-medical-muted dark:text-dark-muted font-semibold opacity-50 cursor-not-allowed">
                                            <i className="fa-solid fa-file-pdf"></i>
                                            <span>Past Papers (Coming Soon)</span>
                                        </div>
                                    </div>
                                </div>
                            </aside>

                            <main className="w-full md:w-2/3">
                                <div className="mb-8 relative">
                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-medical-muted dark:text-dark-muted">
                                        <i className="fa-solid fa-magnifying-glass"></i>
                                    </div>
                                    <input
                                        type="text"
                                        placeholder="Search chapters or topics..."
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="w-full py-4 pl-12 pr-4 bg-white dark:bg-dark-card rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-medical-teal dark:focus:ring-cyan-500 transition-all duration-300 placeholder:text-medical-muted dark:placeholder:text-dark-muted"
                                    />
                                </div>

                                <div className="space-y-6">
                                    {filteredSections.length > 0 ? (
                                        filteredSections.map((sec, index) => (
                                            <div
                                                key={`${sec.title}-${index}`}
                                                className="w-full bg-white dark:bg-dark-card p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 hover:border-medical-teal dark:hover:border-cyan-500 hover:shadow-cyan-50 dark:hover:shadow-none hover:shadow-lg transition-all duration-300 text-left flex items-center justify-between group"
                                            >
                                                <button
                                                    type="button"
                                                    onClick={() => setSection(sec)}
                                                    className="flex items-center gap-6 flex-grow text-left"
                                                >
                                                    <div className="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-700 text-medical-teal dark:text-cyan-400 flex items-center justify-center font-bold group-hover:bg-medical-teal dark:group-hover:bg-cyan-500 group-hover:text-white dark:group-hover:text-slate-900 transition-colors duration-300">
                                                        {index + 1}
                                                    </div>
                                                    <div className="flex-grow">
                                                        <h3 className="text-xl font-bold mb-1 group-hover:text-medical-teal dark:group-hover:text-cyan-400">{sec.title}</h3>
                                                        <p className="text-medical-muted dark:text-dark-muted line-clamp-1">{sec.content}</p>
                                                    </div>
                                                </button>

                                                <div className="flex items-center gap-4">
                                                    {sec.important && (
                                                        <span className="bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-500 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-1">
                                                            <i className="fa-solid fa-star"></i> Important
                                                        </span>
                                                    )}
                                                    <button
                                                        type="button"
                                                        onClick={(e) => toggleBookmark(sec.title, e)}
                                                        className={`text-2xl transition-colors duration-300 ${bookmarks.includes(sec.title) ? 'text-amber-500' : 'text-slate-300 dark:text-slate-600 hover:text-amber-400'}`}
                                                        aria-label={`Toggle bookmark for ${sec.title}`}
                                                    >
                                                        <i className="fa-solid fa-bookmark"></i>
                                                    </button>
                                                    <i className="fa-solid fa-chevron-right text-slate-300 dark:text-slate-600 group-hover:text-medical-teal dark:group-hover:text-cyan-500"></i>
                                                </div>
                                            </div>
                                        ))
                                    ) : (
                                        <div className="text-center py-12 text-medical-muted dark:text-dark-muted">
                                            <i className="fa-solid fa-box-open text-4xl mb-4 opacity-50"></i>
                                            <p className="text-lg font-medium">No chapters found matching your search.</p>
                                        </div>
                                    )}
                                </div>
                            </main>
                        </div>
                    </div>
                );
            };

            const renderReadingView = () => (
                <div className="container mx-auto max-w-4xl px-6 pb-24">
                    <button
                        type="button"
                        onClick={() => setSection(null)}
                        className="text-medical-teal dark:text-cyan-400 font-semibold mb-6 flex items-center gap-2 hover:translate-x-[-4px] transition-transform"
                    >
                        <i className="fa-solid fa-arrow-left"></i> Back to Chapters
                    </button>

                    <article className="bg-white dark:bg-dark-card p-10 md:p-12 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors duration-300">
                        <div className="flex justify-between items-start mb-6">
                            <h2 className="text-4xl font-extrabold text-medical-text dark:text-dark-text leading-tight">{section.title}</h2>
                            <button
                                type="button"
                                onClick={(e) => toggleBookmark(section.title, e)}
                                className={`text-3xl transition-colors duration-300 ${bookmarks.includes(section.title) ? 'text-amber-500' : 'text-slate-300 dark:text-slate-600 hover:text-amber-400'}`}
                                aria-label={`Toggle bookmark for ${section.title}`}
                            >
                                <i className="fa-solid fa-bookmark"></i>
                            </button>
                        </div>

                        {section.important && (
                            <div className="bg-amber-50 dark:bg-amber-900/20 border-l-4 border-amber-500 p-6 rounded-r-2xl mb-10">
                                <div className="flex items-start">
                                    <div className="flex-shrink-0 text-amber-500 text-2xl">
                                        <i className="fa-solid fa-triangle-exclamation"></i>
                                    </div>
                                    <div className="ml-4">
                                        <h3 className="text-lg font-bold text-amber-800 dark:text-amber-400">Important Highlight</h3>
                                        <p className="text-amber-700 dark:text-amber-300 mt-1 font-semibold">{section.important}</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="w-24 h-1 bg-medical-teal dark:bg-cyan-500 rounded-full mb-10"></div>
                        <div className="prose prose-slate dark:prose-invert prose-lg max-w-none text-medical-muted dark:text-dark-muted leading-relaxed">
                            {section.content.split('\n').map((paragraph, i) => (
                                <p key={i} className="mb-6">{paragraph}</p>
                            ))}
                        </div>
                    </article>
                </div>
            );

            return (
                <div className="min-h-screen bg-medical-bg dark:bg-dark-bg transition-colors duration-300">
                    {renderHeader()}
                    {!section && renderBreadcrumbs()}

                    {view === 'landing' && renderLanding()}
                    {view === 'year-select' && renderYearSelect()}
                    {view === 'subject-list' && renderSubjectList()}
                    {view === 'subject-detail' && !section && renderSubjectDetail()}
                    {section && renderReadingView()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
